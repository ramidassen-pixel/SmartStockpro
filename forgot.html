<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<title>Forgot password — SmartStock Pro</title>
<link rel="icon" href="pwa/icon-192.png">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth">
  <div class="au-floor" aria-hidden="true">
    <span style="--c:0;--r:0;--o:.16"></span><span style="--c:1;--r:0;--o:.09"></span><span style="--c:2;--r:0;--o:.05"></span>
    <span style="--c:0;--r:1;--o:.10"></span><span style="--c:1;--r:1;--o:.05"></span><span style="--c:0;--r:2;--o:.05"></span>
  </div>
  <main class="au-wrap">
    <div class="au-brand">
      <img src="pwa/icon-192.png" alt="" width="44" height="44">
      <div class="au-name">SmartStock Pro</div>
    </div>
    <p class="au-tagline">Sales, stock and money for your shop, in one place.</p>

    <section class="au-panel">
      <h1 class="au-h1">Forgot your password?</h1>
      <p class="au-lead">Enter the email you signed up with. We'll send you a link to set a new password.</p>

      <div id="form-area">
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
        <div class="fg">
          <label class="fl" for="email">Email</label>
          <input class="fi" id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <button id="send-btn" type="button" class="btn-primary" onclick="sendReset()">Send reset link</button>
      </div>

      <p class="au-alt"><a class="au-link" href="index.html">Back to sign in</a></p>
    </section>

    <p class="au-foot">SmartStock Pro V5, made in Monrovia, Liberia</p>
  </main>
<script>
var SUPABASE_AUTH_URL = 'https://ovbtqkpvhivqnnxojjwu.supabase.co/auth/v1';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92YnRxa3B2aGl2cW5ueG9qand1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTQ1NDEsImV4cCI6MjA5Njc5MDU0MX0.TZ_B5NBC3uIyqMYs442umeoi3o78CCwTZW6YgHS9efw';

var waitUntil = 0;

function sendReset() {
  var email = document.getElementById('email').value.trim().toLowerCase();
  var msg = document.getElementById('msg');
  var btn = document.getElementById('send-btn');
  if (btn.disabled) return;   // Enter while a send is already running
  var wait = Math.ceil((waitUntil - Date.now()) / 1000);
  if (wait > 0) {
    msg.className = 'msg err';
    msg.textContent = 'Please wait ' + wait + 's before sending another link.';
    return;
  }
  msg.className = 'msg'; msg.textContent = '';

  if (!email || email.indexOf('@') === -1) {
    msg.className = 'msg err';
    msg.textContent = 'Enter a valid email address.';
    return;
  }

  btn.disabled = true; btn.textContent = 'Sending…';

  var resetUrl = location.origin + location.pathname.replace(/[^\/]*$/, '') + 'reset.html';

  fetch(SUPABASE_AUTH_URL + '/recover?redirect_to=' + encodeURIComponent(resetUrl), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
    body: JSON.stringify({ email: email }),
  })
  .then(function (r) {
    btn.disabled = false; btn.textContent = 'Send reset link';
    if (r.ok || r.status === 429) waitUntil = Date.now() + 60000;
    if (r.ok) {
      msg.className = 'msg ok';
      msg.textContent = 'If an account exists for ' + email + ', a reset link has been sent. Check your inbox and spam folder, then tap the link.';
    } else {
      msg.className = 'msg err';
      msg.textContent = r.status === 429
        ? 'Too many reset requests. Please wait a few minutes and try again.'
        : r.status >= 500
          ? 'The reset email could not be sent because the app\'s email service is not working right now. Please try again later, or message SmartStock Pro on WhatsApp: +231 88 975 6551.'
          : 'Could not send the reset link (error ' + r.status + '). Please check the email address and try again.';
    }
  })
  .catch(function () {
    btn.disabled = false; btn.textContent = 'Send reset link';
    msg.className = 'msg err';
    msg.textContent = 'No connection. Check your internet and try again.';
  });
}
document.getElementById('email').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') sendReset();
});
// Bring over the email already typed on the sign-in screen (kept out of the URL)
try {
  var typed = sessionStorage.getItem('ssp_forgot_email');
  if (typed) { document.getElementById('email').value = typed; sessionStorage.removeItem('ssp_forgot_email'); }
} catch (e) {}
</script>
</body>
</html>
