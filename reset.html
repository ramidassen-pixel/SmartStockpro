<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<title>Set a new password — SmartStock Pro</title>
<link rel="icon" href="pwa/icon-192.png">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth">
  <div class="au-floor" aria-hidden="true">
    <span style="--c:0;--r:0;--o:.16"></span><span style="--c:1;--r:0;--o:.09"></span><span style="--c:2;--r:0;--o:.05"></span>
    <span style="--c:0;--r:1;--o:.10"></span><span style="--c:1;--r:1;--o:.05"></span><span style="--c:0;--r:2;--o:.05"></span>
  </div>
  <main class="au-wrap">
    <div class="au-brand">
      <img src="pwa/icon-192.png" alt="" width="44" height="44">
      <div class="au-name">SmartStock Pro</div>
    </div>
    <p class="au-tagline">Sales, stock and money for your shop, in one place.</p>

    <section class="au-panel">
      <h1 class="au-h1">Set a new password</h1>
      <p class="au-lead" id="sub-text">Choose a new password for your account.</p>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>

      <div id="form-area">
        <div class="fg">
          <label class="fl" for="pw1">New password</label>
          <div class="pw-wrap">
            <input class="fi" id="pw1" type="password" autocomplete="new-password" aria-describedby="pw1-hint">
            <button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false" onclick="toggle('pw1')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="au-hint" id="pw1-hint">At least 8 characters, with a capital letter, a small letter and a number.</p>
        </div>
        <div class="fg">
          <label class="fl" for="pw2">Type it again</label>
          <div class="pw-wrap">
            <input class="fi" id="pw2" type="password" autocomplete="new-password">
            <button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false" onclick="toggle('pw2')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button id="save-btn" type="button" class="btn-primary" onclick="savePassword()">Save new password</button>
      </div>

      <p class="au-alt"><a class="au-link" href="index.html">Back to sign in</a></p>
    </section>

    <p class="au-foot">SmartStock Pro V5, made in Monrovia, Liberia</p>
  </main>
<script>
(function () {
  var SUPABASE_AUTH_URL = 'https://ovbtqkpvhivqnnxojjwu.supabase.co/auth/v1';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92YnRxa3B2aGl2cW5ueG9qand1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTQ1NDEsImV4cCI6MjA5Njc5MDU0MX0.TZ_B5NBC3uIyqMYs442umeoi3o78CCwTZW6YgHS9efw';

  // Supabase puts the result in the URL hash (#access_token=...&type=recovery,
  // or #error=...&error_code=otp_expired); some errors come as ?error=... instead.
  var p = new URLSearchParams((location.hash || '').replace(/^#/, '') + '&' + (location.search || '').replace(/^\?/, ''));
  var params = { access_token: p.get('access_token'), type: p.get('type'),
                 error: p.get('error') || p.get('error_code'), error_code: p.get('error_code') };

  // Keep the one-time reset token out of the address bar and browser history
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  var msg = document.getElementById('msg');
  var formArea = document.getElementById('form-area');
  var subText = document.getElementById('sub-text');
  var NEW_LINK = ' <a href="forgot.html">Send me a new link</a>';

  function linkProblem(text) {
    formArea.style.display = 'none';
    subText.textContent = '';
    msg.className = 'msg err';
    msg.innerHTML = text + NEW_LINK;
  }

  if (params.error) {
    linkProblem(params.error_code === 'otp_expired'
      ? 'This reset link has expired or was already used.'
      : 'This reset link did not work.');
  } else if (!params.access_token || params.type !== 'recovery') {
    linkProblem('This page must be opened from the reset link in your email.');
  }

  var saving = false;

  window.toggle = function (id) {
    var el = document.getElementById(id);
    var show = el.type === 'password';
    el.type = show ? 'text' : 'password';
    var eye = el.parentNode.querySelector('.pw-eye');
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  };

  window.savePassword = function () {
    if (saving) return;
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;
    msg.className = 'msg'; msg.textContent = '';

    if (pw1.length < 8 || !/[A-Z]/.test(pw1) || !/[a-z]/.test(pw1) || !/[0-9]/.test(pw1)) {
      msg.className = 'msg err';
      msg.textContent = 'Password must be at least 8 characters with uppercase, lowercase and a number.';
      return;
    }
    if (pw1 !== pw2) {
      msg.className = 'msg err';
      msg.textContent = 'Passwords do not match.';
      return;
    }

    var btn = document.getElementById('save-btn');
    saving = true;
    btn.disabled = true; btn.textContent = 'Saving…';

    pwnedPw(pw1).then(function (pwned) {
      if (pwned) {
        saving = false;
        btn.disabled = false; btn.textContent = 'Save new password';
        msg.className = 'msg err';
        msg.textContent = 'This password has appeared in a known data breach, so it isn\'t safe to use. Please choose a different one.';
        return;
      }
      updatePassword(pw1, btn);
    });
  };

  // Leaked-password check (Have I Been Pwned, k-anonymity: only 5 hash chars are sent).
  // Same logic as Auth._pwnedPw in assets/js/auth.js — this page doesn't load that file.
  function pwnedPw(pw) {
    try {
      return crypto.subtle.digest('SHA-1', new TextEncoder().encode(pw))
        .then(function (buf) {
          var hash = Array.prototype.map.call(new Uint8Array(buf), function (b) {
            return ('0' + b.toString(16)).slice(-2);
          }).join('').toUpperCase();
          var suffix = hash.slice(5);
          return fetch('https://api.pwnedpasswords.com/range/' + hash.slice(0, 5), { headers: { 'Add-Padding': 'true' } })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (body) {
              return body.split('\n').some(function (line) {
                var parts = line.trim().split(':');
                return parts[0] === suffix && Number(parts[1]) > 0;
              });
            });
        })
        .catch(function () { return false; });
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function updatePassword(pw1, btn) {
    fetch(SUPABASE_AUTH_URL + '/user', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + params.access_token,
      },
      body: JSON.stringify({ password: pw1 }),
    })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, data: d }; }); })
    .then(function (res) {
      saving = false;
      btn.disabled = false; btn.textContent = 'Save new password';
      if (!res.ok) {
        var code = (res.data && (res.data.error_code || res.data.code)) || '';
        if (res.status === 401 || res.status === 403 || /expired|invalid|jwt/i.test(code + ' ' + (res.data.msg || ''))) {
          linkProblem('This reset link has expired. Reset links work once and for a limited time.');
        } else if (code === 'same_password') {
          msg.className = 'msg err';
          msg.textContent = 'That is your current password. Choose a different one.';
        } else {
          msg.className = 'msg err';
          msg.textContent = (res.data && (res.data.msg || res.data.error_description)) || 'Could not update the password. Please try again.';
        }
        return;
      }
      // Sign out every device, including whoever may have had the old password
      fetch(SUPABASE_AUTH_URL + '/logout?scope=global', {
        method: 'POST', keepalive: true,
        headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + params.access_token },
      }).catch(function () {});
      params.access_token = null;
      formArea.style.display = 'none';
      subText.innerHTML = '<strong style="color:var(--au-ok)">Password updated.</strong> For your safety you have been signed out on every device. Sign in again with your new password.';
    })
    .catch(function () {
      saving = false;
      btn.disabled = false; btn.textContent = 'Save new password';
      msg.className = 'msg err';
      msg.textContent = 'No connection. Check your internet and try again.';
    });
  }
})();
</script>
</body>
</html>
